name: Simplify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Simplify against this repo
        uses: ./
        with:
          paths: 'src'
          max-loc: '100'
          max-complexity: '10'
